# Builds the ai-service Docker image on GitHub's machines and publishes it to the
# GitHub Container Registry, where each member's Azure Web App pulls it from.
#
# One image serves every model (story points, velocity, risk, cost, allocation). Each
# member's Web App runs the same image; the backend's ai_models table decides which
# member's app answers for which model. See docs/hosting.md.
#
# Image: ghcr.io/<repository owner, lowercase>/sprintiq-ai:latest, plus one tag per
# commit so a deployment can be pinned and rolled back.
name: AI service image

on:
  workflow_dispatch:
  push:
    branches: [Latest, main]
    # Only what goes into the image: tests, training scripts and experiments do not.
    paths:
      - "ai-service/app/**"
      - "ai-service/models/**"
      - "ai-service/requirements.txt"
      - "ai-service/Dockerfile"
      - "ai-service/.dockerignore"
      - ".github/workflows/ai-service-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; the repository owner is not.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sprintiq-ai" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
