# Builds the backend's Docker image on GitHub's machines and publishes it to the
# GitHub Container Registry, where Azure App Service pulls it from.
#
# Built here rather than on a laptop because a laptop build depends on that laptop's
# network: on one with Norton's HTTPS scanning every download inside the build fails,
# and on a slow line Maven alone takes many minutes. See docs/hosting.md.
#
# Image: ghcr.io/<repository owner, lowercase>/sprintiq-backend:latest, plus one tag
# per commit so a deployment can be pinned and rolled back.
name: Backend image

on:
  workflow_dispatch:
  push:
    branches: [Latest, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; the repository owner is not.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sprintiq-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
