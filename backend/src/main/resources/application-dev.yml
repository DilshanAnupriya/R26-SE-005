app:
  cors:
    # Also lets the app work when opened on this machine's LAN address (the
    # "Network" URL next dev prints) or from a phone on the same network. The
    # wildcards are origin patterns, so dev only; prod keeps an exact list.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://192.168.*:3000,http://10.*:3000}
  seed:
    enabled: true
  ai:
    # Dev talks to the real estimation service, so the model in the repo is what
    # you see on screen. Falls back to the mock automatically when the service is
    # not up: HttpAiModelClient turns a connection failure into a FAILED
    # prediction, and the UI shows the story unestimated rather than inventing a
    # number. Run it with:  cd ai-service && uvicorn app.main:app --port 8000
    provider: ${AI_PROVIDER:http}
logging:
  level:
    org.hibernate.SQL: DEBUG

