spring:
  application:
    name: sprintiq-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sprintiq}
    username: ${DB_USERNAME:sprintiq}
    password: ${DB_PASSWORD:sprintiq}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 20000
      pool-name: sprintiq-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: sprintiq-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      # Base64-encoded 512-bit secret. MUST be overridden in production.
      secret: ${JWT_SECRET:c3ByaW50aXEtZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
      issuer: sprintiq
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    password-reset-ttl: PT1H
    invitation-ttl: P7D
    email-verification-ttl: P2D
    mfa-enabled: ${MFA_ENABLED:false}
  rate-limit:
    enabled: true
    auth-requests-per-minute: 10
    authenticated-requests-per-minute: 600
    anonymous-requests-per-minute: 60
  storage:
    provider: ${STORAGE_PROVIDER:local}     # local | s3
    local-path: ${STORAGE_LOCAL_PATH:./data/attachments}
    allowed-content-types: image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,text/csv,application/zip,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  ai:
    enabled: true
    provider: ${AI_PROVIDER:mock}           # mock | http
    timeout-ms: 4000
    cache-ttl: PT6H
    max-batch-size: 50
    models:
      story-points:
        code: M1_STORY_POINTS
        version: ${AI_M1_VERSION:1.0.0}
        endpoint: ${AI_M1_URL:http://ai-estimation:8000/v1/predict/story-points}
      velocity:
        code: M1_VELOCITY
        version: ${AI_M1V_VERSION:1.0.0}
        endpoint: ${AI_M1V_URL:http://ai-estimation:8000/v1/predict/velocity}
      over-budget-risk:
        code: M2_OVER_BUDGET
        version: ${AI_M2A_VERSION:1.0.0}
        endpoint: ${AI_M2A_URL:http://ai-risk:8000/v1/predict/over-budget}
      requirement-change-risk:
        code: M2_REQUIREMENT_CHANGE
        version: ${AI_M2B_VERSION:1.0.0}
        endpoint: ${AI_M2B_URL:http://ai-risk:8000/v1/predict/requirement-change}
      allocation:
        code: M3_ALLOCATION
        version: ${AI_M3_VERSION:1.0.0}
        endpoint: ${AI_M3_URL:http://ai-allocation:8000/v1/predict/rank}
      cost-initial:
        code: M4_COST_INITIAL
        version: ${AI_M4A_VERSION:1.0.0}
        endpoint: ${AI_M4A_URL:http://ai-cost:8000/v1/predict/initial}
      cost-mid-sprint:
        code: M4_COST_MID
        version: ${AI_M4B_VERSION:1.0.0}
        endpoint: ${AI_M4B_URL:http://ai-cost:8000/v1/predict/mid-sprint}
  seed:
    enabled: ${SEED_ENABLED:false}

logging:
  level:
    root: INFO
    com.sprintiq.pms: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: WARN
