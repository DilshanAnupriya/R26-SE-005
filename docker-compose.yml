services:
  postgres:
    image: postgres:16-alpine
    container_name: sprintiq-postgres
    environment:
      POSTGRES_DB: sprintiq
      POSTGRES_USER: sprintiq
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sprintiq}
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintiq -d sprintiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sprintiq-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: sprintiq-mailpit
    # Host ports shifted by one, exactly as postgres publishes 5433 rather than 5432:
    # another project on this machine already owns 1025/8025, and a fixture that will
    # not start because of an unrelated container is a fixture people stop running.
    # Inside the compose network the backend still reaches mailpit:1025, so only the
    # host mapping moves.
    ports: ["1026:1025", "8026:8025"]   # SMTP, web UI

  backend:
    build: ./backend
    container_name: sprintiq-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD:-sprintiq}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_BASE_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      # The risk advisor is the one model that leaves this machine, and it stays off
      # until a key is set. It has to be forwarded explicitly: compose reads .env for
      # its own substitutions, it does not hand the file to the container, so an
      # operator who sets ADVISOR_API_KEY and never sees advice appear has no way to
      # tell a missing key from a passthrough that was never wired.
      ADVISOR_API_KEY: ${ADVISOR_API_KEY:-}
      ADVISOR_MODEL: ${ADVISOR_MODEL:-gemini-2.0-flash}
    ports: ["8080:8080"]
    volumes: ["attachment-data:/app/data/attachments"]

  frontend:
    build: ./frontend
    container_name: sprintiq-frontend
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports: ["3000:3000"]

volumes:
  postgres-data:
  redis-data:
  attachment-data:
