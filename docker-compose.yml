services:
  postgres:
    image: postgres:16-alpine
    container_name: sprintiq-postgres
    environment:
      POSTGRES_DB: sprintiq
      POSTGRES_USER: sprintiq
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sprintiq}
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintiq -d sprintiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sprintiq-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: sprintiq-mailpit
    ports: ["1025:1025", "8025:8025"]   # SMTP, web UI

  backend:
    build: ./backend
    container_name: sprintiq-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD:-sprintiq}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_BASE_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    ports: ["8080:8080"]
    volumes: ["attachment-data:/app/data/attachments"]

  frontend:
    build: ./frontend
    container_name: sprintiq-frontend
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports: ["3000:3000"]

volumes:
  postgres-data:
  redis-data:
  attachment-data:
