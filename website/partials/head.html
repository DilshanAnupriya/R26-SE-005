<script>
  (function () {
    var d = document.documentElement, t = null;
    d.classList.remove("no-js"); d.classList.add("js");
    try { t = localStorage.getItem("siq-theme"); } catch (e) {}
    if (t !== "night") t = "day";
    d.setAttribute("data-theme", t);
    d.setAttribute("data-light", t);
  })();
</script>
